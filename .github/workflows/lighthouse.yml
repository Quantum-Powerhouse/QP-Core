name: Lighthouse

# Performance / accessibility / SEO budget against production, on a schedule
# and on demand. Informational at first (no hard fail) — budgets tighten once
# the baseline is known. Mobile emulation, because that is where three WebGL
# canvases hurt first.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Audit production (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://quantum.sadeqi.me/
            https://quantum.sadeqi.me/playground/arcade
            https://quantum.sadeqi.me/research
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
