name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, validate & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Node 24 runs the TypeScript research data directly via native type
      # stripping, which is what lets validate-research.mjs import the same
      # modules the site renders instead of re-parsing them.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Guards the research record: schema integrity, valid citations, and
      # drift between research/evidence.json and the data the site renders.
      - name: Validate research artifacts
        run: npm run validate:research

      - name: Build
        run: npm run build
